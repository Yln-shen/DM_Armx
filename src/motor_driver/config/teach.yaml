# 零重力手推示教的参数（`gravity_teach.py` 读它；**Python 旁路**，不走 ros2_control）
#
# ⚠️ 自由区不在这个文件里：它是**启动时按实测姿态现算的**（见 gravity_teach.py 的 build_free_zones）。
#    理由：写死一组区间，换一个起始姿态就失效；而"先把臂摆到安全姿态"本来就是演示的前置条件。
#    这里给的 `free_half_width` 与 `min_buffer` 才是旋钮。

# ── 循环与上电 ──
loop_hz: 100.0            # 与 C++ 插件同频（feedback_hz 也是 100）；每圈 poll → 算 → 发 6 帧
start_scale: 0.3          # 使能后**立刻**用的重力前馈比例（不是 0！见下）
ramp_sec: 15.0            # 从 start_scale 线性升到 --scale 用多久
                          # 为什么不是从 0 开始：scale=0 时臂只靠 kp 托着，会明显下垂
                          # （下沉量 ≈ tau_g/kp_demo），分级上电要"看得见方向"，不是"先掉一下"

# ── 手感（力矩增益）──
kp_demo: 4.0              # 闩锁后的"软弹簧"刚度（N·m/rad）。死区 ≈ 前馈误差/kp ≈ 0.42/4 ≈ 0.10 rad
kd: 0.8                   # 阻尼。推起来不发飘；也会占力矩预算（见下）
kp_wall: 25.0             # 缓冲带的刚度上限；实际值每帧按力矩预算现算（通常被预算压得比它小）

# ── 力矩预算（"拒发 = 掉臂"的根治手段，别乱改）──
# `Joint._clamp_mit_torque` 的拒发判据是：|kp·Δq + kd·Δv| > torque_max ⇒ 抛 ⇒ 掉臂（陷阱 #51）。
# 本脚本每帧在**同一份缓存状态**上先算预算，保证：
#     |tau_ff| + |kp·Δq| + |kd·Δv| ≤ torque_budget_frac · torque_max      (frac < 1)
# ⇒ 拒发判据恒不成立，且 tau_ff 也到不了钳位边界（重力给得足）。
torque_budget_frac: 0.7   # 给 torque_max 的几分之几；留 30% 吸收缓存滞后与量化误差
kd_share: 0.5             # 阻尼最多占 PD 预算的一半（另一半留给软墙的弹簧项）

# ── 自由区 / 软墙 ──
free_half_width: 0.25     # 自由区半宽（**关节侧** rad）：以实测姿态为中心，再被软限位与 min_buffer 夹
min_buffer: 0.05          # 缓冲带最小宽度：太窄就"顶不住"（但再窄也不会撞硬限位，只是手感差）
min_travel: 0.02          # 起点两侧"够不够宽敞"的**警告**门槛（rad ≈ 1.15°）——**默认只警告不拒绝**。
                          # 为什么不当硬错误：行程窄的那一侧通常就是**机械硬限位**（失能后臂停在那儿
                          # 就是证据，折叠位就是这样），软墙在那边本来就冗余。想变回硬错误用 --strict-travel。
release_band: 0.15        # 闩锁后推开超过它就解锁回"跟随"（继续推）
                          # ⚠️ 必须 > 死区（0.10），否则**前馈误差造成的自然下垂会自己解锁** ⇒ 臂会一直漂

# ── 静止判定（闩锁 = "松手停住"）──
v_latch: 0.05             # |v| 小于它（rad/s，用滤波后的速度）
t_latch: 0.3              # 持续这么久 ⇒ 闩锁到当前位置
vel_filter_alpha: 0.3     # 速度低通系数（反馈速度是 12 位编码，低速下只有几个 LSB、符号会抖）

# ── 摩擦前馈 ──
# 系数（friction_c）与斜率（friction_v_eps）都从 arm_description/config/mit_gains.yaml 取 —— 那是真源，
# 不在这里另抄一份（抄了就会漂）。
friction_ff: true
friction_deadband: 0.02   # |v| 小于它就**不给**摩擦前馈：静止时摩擦方向不确定，
                          # 猜错等于主动把关节推走（这是物理，不是保守 —— 见 mit_gains.yaml 顶部）

# ── 安全 / 提示 ──
v_warn: 2.0               # |v| 超过它就在终端提醒"推得太快"（限流打印）
heartbeat_sec: 2.0        # 心跳打印间隔
wall_warn_sec: 1.0        # "进入缓冲带"提醒的限流间隔

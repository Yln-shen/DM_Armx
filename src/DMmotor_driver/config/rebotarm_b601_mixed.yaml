# 整臂配置 —— **数据**。类与校验在 DMmotor_driver/arm_config.py。
#
# 规格来源：DESIGN.md §2.1（硬件分配）§2.2（限位，真源是 URDF）§2.3（夹爪换算）
#           §4.2/§4.3（字段与力矩分档）§六（本文件形态）；TESTING.md §2.7/§2.8（实测映射范围）
#
# ⚠️ 两条读之前要记住的：
#   1. 这里**不写** (PMAX, VMAX, TMAX)。发帧一律用电机 0x15/0x16/0x17 的**回读值**
#      （§161）；写死一份只会让人忘了去读，而用错档位解力矩**差 2.8 倍且不报错**。
#   2. direction / offset 现在全是 +1 / 0.0，含义是**「未标定」**，不是标定结果。
#      §2.1 原话：「默认值必须让『不标定即等于 reBot 行为』」。标定（§七）之前
#      不要在这里填任何猜出来的数 —— 猜出来的值和标定过的值长得一模一样。

name: rebotarm_b601_mixed

channel: /dev/ttyACM0          # USB-CAN 适配器串口
baudrate: 921600               # **UART 侧**；CAN 侧固定 1Mbps（寄存器 0x23 can_br）
serial_timeout: 0.003          # pyserial 读超时。注意 §六 那句「必须远小于 1/500Hz」
                               # 在本层**不成立也不必要** —— MotorBus.send_frame 是
                               # 非阻塞发（写串口即返回、不等回包），这个约束只对
                               # 「发一帧等一帧」的 wait_feedback 路径有意义
send_hz: 500.0                 # 发帧循环
feedback_hz: 100.0             # 收帧循环（也定义 torque_monitor_count 的时基）
control_mode: POS_VEL          # 本机全 POS_VEL 固件闭环（§2.6）；MIT 预留
can_bitrate: 1000000
enable_delay: 3.0              # 使能后等多久再发第一条运动命令

# 关节限位的**唯一真源**（§2.2）。相对本文件所在目录，即 ../../mujoco_pkg/description/
# 注意 §六 示例里写的 "../third_party/urdf/ReBot_Arm_DM.urdf" 已经过时（third_party 下
# 只有厂商 Python 例程），实际在 mujoco_pkg/description/。
urdf_path: ../../mujoco_pkg/description/ReBot_Arm_DM.urdf

joints:

  joint1:
    motor_type: "4340P"
    slave_id: 0x01
    master_id: 0x11
    direction: 1
    offset: 0.0
    position_min: null         # null = 从 URDF 取（§4.2）；§2.2: [-2.8, 2.8]
    position_max: null
    velocity_max: 1.0          # MoveIt 限速（§2.2）
    pos_kp: 150.0
    pos_ki: 0.5
    vel_kp: 0.0125
    vel_ki: 0.004
    vlim: 5.0
    mit_kp: 120.0
    mit_kd: 8.0
    # torque_max / torque_monitor_threshold 不写 —— 由 motor_type 派生（4340P: 12.0/15.0）
    torque_monitor_count: 10   # × feedback_hz(100) = 100 ms 防抖
    motor_timeout_ms: 200
    # 摩擦：只有 0x01 实测过。**是区间不是常数** —— 粘滑，22% 离散度（§2.8）
    friction_min: 0.564
    friction_max: 0.706

  joint2:
    motor_type: "4340P"
    slave_id: 0x02
    master_id: 0x12
    direction: 1
    offset: 0.0
    position_min: null         # URDF: [-3.14, 0]
    position_max: null
    velocity_max: 1.0
    pos_kp: 150.0
    pos_ki: 0.5
    vel_kp: 0.0125
    vel_ki: 0.004
    vlim: 5.0
    mit_kp: 120.0
    mit_kd: 8.0
    # torque_max / torque_monitor_threshold 不写 —— 由 motor_type 派生（4340P: 12.0/15.0）
    torque_monitor_count: 10
    motor_timeout_ms: 200
    # 摩擦：**未测**（§823：7 台里只测了 0x01 和 0x04）。留空 = 未测，不是 0
    friction_min: null
    friction_max: null

  joint3:
    motor_type: "4340P"
    slave_id: 0x03
    master_id: 0x13
    direction: 1
    offset: 0.0
    position_min: null         # URDF: [-3.14, 0]
    position_max: null
    velocity_max: 1.0
    pos_kp: 150.0
    pos_ki: 0.5
    vel_kp: 0.0125
    vel_ki: 0.004
    vlim: 5.0
    mit_kp: 120.0
    mit_kd: 8.0
    # torque_max / torque_monitor_threshold 不写 —— 由 motor_type 派生（4340P: 12.0/15.0）
    torque_monitor_count: 10
    motor_timeout_ms: 200
    friction_min: null
    friction_max: null

  joint4:
    motor_type: "4310"
    slave_id: 0x04
    master_id: 0x14
    direction: 1
    offset: 0.0
    position_min: null         # URDF: [-1.87, 1.57]
    position_max: null
    velocity_max: 1.0
    pos_kp: 70.0               # 4310 档（§2.1）：注意 60~70，不是 joint1 的 150
    pos_ki: 1.0
    vel_kp: 0.0008
    vel_ki: 0.002
    vlim: 3.0
    mit_kp: 18.0
    mit_kd: 2.0
    # torque_max / torque_monitor_threshold 不写 —— 由 motor_type 派生（4310: 3.5/5.0）
    torque_monitor_count: 10
    motor_timeout_ms: 200
    friction_min: 0.145        # 实测（§2.8）
    friction_max: 0.159

  joint5:
    motor_type: "4310"
    slave_id: 0x05
    master_id: 0x15
    direction: 1
    offset: 0.0
    position_min: null         # URDF: [-1.57, 1.57]
    position_max: null
    velocity_max: 1.0
    pos_kp: 60.0
    pos_ki: 1.0
    vel_kp: 0.0008
    vel_ki: 0.002
    vlim: 3.0
    mit_kp: 18.0
    mit_kd: 2.0
    # torque_max / torque_monitor_threshold 不写 —— 由 motor_type 派生（4310: 3.5/5.0）
    torque_monitor_count: 10
    motor_timeout_ms: 200
    friction_min: null
    friction_max: null

  joint6:
    motor_type: "4310"
    slave_id: 0x06
    master_id: 0x16
    direction: 1
    offset: 0.0
    position_min: null         # URDF: [-3.14, 3.14]
    position_max: null
    velocity_max: 1.0
    pos_kp: 60.0
    pos_ki: 1.0
    vel_kp: 0.0008
    vel_ki: 0.002
    vlim: 3.0
    mit_kp: 18.0
    mit_kd: 2.0
    # torque_max / torque_monitor_threshold 不写 —— 由 motor_type 派生（4310: 3.5/5.0）
    torque_monitor_count: 10
    motor_timeout_ms: 200
    friction_min: null
    friction_max: null

# ⚠️ 仍未定：夹爪的 `direction`/`offset`（关节↔电机）和 `m_per_rad`（米↔**电机**）
#    谁管哪一段。§2.3 的 `pos` 就是电机侧读数，所以 m_per_rad 已经跨到电机侧了，
#    direction/offset 目前**没有消费者**。夹爪标定之前不要假定它们生效了。
gripper:
  motor_type: "4310"
  slave_id: 0x07
  master_id: 0x17
  direction: 1
  offset: 0.0
  m_open: 0.10                 # 全开 0.10 m（§2.3）
  rad_open: -5.0               # 对应 -5.0 rad ⇒ m_per_rad = 0.10 / -5.0 = -0.02
  default_force: 0.30
  force_min: 0.05
  force_max: 1.5
  arrive_tol_rad: 0.12
  # POS_VEL / MIT（§2.1 给了数，§4.2/§六 漏了字段 —— 本轮补上）
  pos_kp: 50.0
  pos_ki: 1.0
  vel_kp: 0.0008
  vel_ki: 0.002
  vlim: 3.0
  mit_kp: 8.0
  mit_kd: 1.0
  # 显式覆盖：夹爪是 4310，型号派生会给 3.5/5.0，但夹爪限力远低于同型号关节
  torque_max: 1.5              # 夹爪限力（§4.3）
  torque_monitor: true
  torque_monitor_threshold: 1.8    # 抓空/夹住时最先触发的保护
  torque_monitor_count: 10
  motor_timeout_ms: 200

safety:
  watchdog_timeout: 0.1        # 主机侧：多久没喂就急停
  motor_timeout_ms: 200        # 电机侧看门狗 0x09 的默认值
  temp_warn: 80.0              # 到这儿告警/降速
  temp_fault: 100.0            # 到这儿急停（手册：线圈别超 100℃）
  vbus_min: 15.0
  vbus_max: 32.0
  feedback_hz: 100.0
  enable_delay: 3.0
  emergency_on_error: true

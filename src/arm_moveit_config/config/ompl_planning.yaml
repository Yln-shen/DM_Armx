# OMPL 规划器参数（Jazzy / MoveIt 2.12 的写法 —— 三处与老教程不同，都是实测撞出来的）：
#  ① 插件名是**复数数组** `planning_plugins`（单数 `planning_plugin` 不报错但读出为空 ⇒ move_group abort）；
#  ② 请求适配器前缀是 `default_planning_request_adapters/`（不是 `..._planner_...`）；
#  ③ **AddTimeOptimalParameterization 在 Jazzy 属于 `response_adapters`**（加到 request 里会报
#     "class ... does not exist"）。它负责给几何路径补 time_from_start，**不能少**（否则真机上等于瞬间到位）。
planning_plugins:
  - ompl_interface/OMPLPlanner
request_adapters:
  - default_planning_request_adapters/CheckForStackedConstraints
  - default_planning_request_adapters/CheckStartStateBounds
  - default_planning_request_adapters/CheckStartStateCollision
  - default_planning_request_adapters/ResolveConstraintFrames
  - default_planning_request_adapters/ValidateWorkspaceBounds
response_adapters:
  - default_planning_response_adapters/AddTimeOptimalParameterization
start_state_max_bounds_error: 0.1

arm:
  default_planner_config: RRTConnect
  longest_valid_segment_fraction: 0.005
  planner_configs:
    RRTConnect:
      type: geometric::RRTConnect
      range: 0.0
    RRT:
      type: geometric::RRT
      range: 0.0
      goal_bias: 0.05
    PRM:
      type: geometric::PRM

# M2：mock 硬件上的 ros2_control 配置（**不接真机**）。
# 用法见 launch/arm_system.launch.py（总 launch；默认 use_mock:=true 就是这份配置）。
#
# 真机版本（M5）会另起一份：把硬件接口换成 motor_driver_hardware/DmSystemInterface，
# 控制器本身不用改（命令接口仍是 position，背后走 POS_VEL）。
#
# ⚠️ **只有这一份**控制器配置：POS_VEL 路径，只声索 position。
#    **别往这份里加 velocity**：一旦声索 velocity，JTC 的到达判据会额外算速度误差，真机会卡死
#    （陷阱 #40）。原来那份 `ros2_controllers_mit.yaml` 已随 MIT 路径一起删（2026-10-14）。
controller_manager:
  ros__parameters:
    update_rate: 100          # Hz；也是下面两个控制器的 update 频率

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    # 末端允许非零速度：轨迹怎么给就怎么走，别在终点硬刹车
    allow_nonzero_velocity_at_trajectory_end: true

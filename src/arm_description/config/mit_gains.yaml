# MIT 前馈的保持增益（逐关节）—— 只在 `gravity_ff:=true`（这条链走 MIT）时用得上。
#
# ⚠️ **这些是占位值，不是标定结果。** DESIGN §D5b 明确说 4340P(j1~j3) 与 4310(j4~j6) 的 kp
#    量级差 5 倍以上（前者静摩擦 ~0.62 N·m、后者 ~0.145），7.0 只对 4310 合适。
#    2.4.4 真机验收时逐关节标定，标完回来改这里。
#
# 为什么单独一份、不塞进 motor_driver/config/joint.yaml：
#   那份是 **Python 驱动层**的真源，`arm_config.py` 用 dataclass **严格**解析
#   （多写一个键就 TypeError）⇒ 塞进去会连带改 Python 包。而 kp/kd 只是 ros2_control
#   侧的控制器增益，跟驱动层无关，放这里更干净。
#
# 用途：被 urdf/inc/arm.ros2_control.xacro 的**真机分支**读成每关节的 <param>，
#      再由 DmSystemInterface 解析进 JointConfig。
#
# ── ki_hold：宿主侧积分增益（2026-10-05 加）──
# **MIT 模式下固件没有积分**（τ = kp·Δp + kd·Δv + t_ff），所以 MIT 的稳态误差被
#   不可重复扰动/kp 卡住：真机实测 j3 在 kp=7 下差 0.134 rad，而 POS_VEL（固件积分）是 0.0016 rad。
#   把这 0.8 N·m 的扰动**积掉**，MIT 才能追平 POS_VEL 的静态精度。
# 做法：τ_i += ki_hold · (q_des − q) · dt，加进 MIT 帧的 t_ff（即宿主侧 PI + 重力前馈）。
# ⚠️ **默认 0.0 = 完全不生效**（一个字节都不变），要分级打开：
#   先保持模式小步试（如 0.3），确认静差收敛且**不振荡**，再往上加。
# ⚠️ 积分 + 100 Hz + 干摩擦（j3 有 ~0.8 N·m 不可重复扰动）是**极限环的经典配方**
#   ⇒ 插件里配了抗饱和（钳 ±0.3·torque_max 且饱和时停积）、误差门控（>0.15 rad 不积）、
#     以及四个复位条件（激活 / 命令跳变 / 残差守卫触发 / 失能）。
joints:
  joint1: {kp_hold: 7.0, kd_hold: 0.8, ki_hold: 0.3}   # 4340P，待标定
  joint2: {kp_hold: 7.0, kd_hold: 0.8, ki_hold: 0.3}   # 4340P，待标定
  joint3: {kp_hold: 7.0, kd_hold: 0.8, ki_hold: 0.3}   # 4340P，待标定
  joint4: {kp_hold: 7.0, kd_hold: 0.8, ki_hold: 0.3}   # 4310，与 DESIGN 参考值一致
  joint5: {kp_hold: 7.0, kd_hold: 0.8, ki_hold: 0.3}   # 4310
  joint6: {kp_hold: 7.0, kd_hold: 0.8, ki_hold: 0.3}   # 4310

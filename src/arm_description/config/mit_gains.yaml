# MIT 前馈的保持增益（逐关节）—— 只在 `gravity_ff:=true`（这条链走 MIT）时用得上。
#
# ⚠️ **这些已经是 2026-10-05 真机分级定出来的值，不再是占位值**（kp 从占位值 7.0 起，
#    7 → 15 → 25 逐级验过；过程见下面第 12 行起的说明）。DESIGN §D5b：4340P(j1~j3) 与 4310(j4~j6)
#    的 kp 量级差 5 倍以上（前者静摩擦 ~0.62 N·m、后者 ~0.145）⇒ **别给全臂同一组增益**。
#    ⚠️ 但仍非终值：j1/j3 的 kp 与 friction_c 缺可靠的重复性数据（`AGENTS.md` §5 末尾"还差"）。
#
# 为什么单独一份、不塞进 motor_driver/config/joint.yaml：
#   那份是 **Python 驱动层**的真源，`arm_config.py` 用 dataclass **严格**解析
#   （多写一个键就 TypeError）⇒ 塞进去会连带改 Python 包。而 kp/kd 只是 ros2_control
#   侧的控制器增益，跟驱动层无关，放这里更干净。
#
# ── kp_hold：位置增益（2026-10-05 真机分级从占位值 7.0 改到 25.0）──
# **静态误差的本质是死区**：稳态 kp·e = 扰动 ⇒ |e| ≤ 扰动/kp。所以 kp 直接决定静态精度：
#   真机实测最大残差 kp=7 **0.106 rad** → kp=15 **0.059** → kp=25 **0.0385**（单调）。
# ⚠️ **宿主侧积分（ki_hold）破不了这个死区**：它以 100 Hz 爬，越过静摩擦就"跳一格"、摩擦反向、
#   再爬 ⇒ ki≥1.0 时出现**极限环**（实测 j3 抖动 0.107 rad）。kp 是**固件在电机里按 10+ kHz 执行**的，
#   所以只有它才能做亚静摩擦的连续蠕动。
# ⚠️ **kp 有硬上界 = torque_max / 轨迹期望滞后**：`clamp_mit_torque` 在 **PD 项自己超过 torque_max**
#   时**拒发** ⇒ write() 返回 ERROR ⇒ CM 报硬件错误 ⇒ 失能 ⇒ **机械臂掉下来**（陷阱 #39）。
#   j1~j3（torque_max 12.0）可到 ~80；**j4~j6（3.5）只能到 ~25**（0.14 rad 滞后）。
# ⚠️ 改善是**次线性**的（kp 7→25 是 3.6 倍、误差只降 2.3 倍，kp·e 从 0.74 涨到 0.96 N·m）
#   ⇒ 疑似传动柔度（编码器在电机侧、看不到减速器扭转），再往上边际收益递减。
#
# 用途：被 urdf/inc/arm.ros2_control.xacro 的**真机分支**读成每关节的 <param>，
#      再由 DmSystemInterface 解析进 JointConfig。
#
# ── friction_c / friction_v_eps：库仑摩擦前馈（2026-10-05 加）──
# 运动时摩擦方向是**确定**的（永远反对速度）⇒ 可以前馈：τ_ff += −friction_c·tanh(v_cmd/friction_v_eps)
# ⚠️ **它治的是运动质量（跟踪误差/换向误差），不是静态精度**。静止时摩擦在 ±F_s 内**任意取值**，
#   方向不确定 ⇒ 猜错反而把关节推走。所以**保持（命令是 NaN）时一律给 0** —— 这是物理，不是保守。
# ⚠️ 符号取自**命令速度**而不是实测速度：实测速度是 12 位编码，低速下只有几个 LSB，符号会抖。
# ⚠️ **没有黏性项**：恒速扫描证明 F 与速度无关（那个"斜率"是时间漂移，倒序一跑就没了）。
#
# 数值来源：恒速三角波扫描（2026-10-05，张开位，同一区间正反各走一遍 ⇒ 位置相关项自动抵消）
#   j1 0.54(±0.12)  j2 0.58(±0.01)  j3 0.75(±0.15)  j4 0.160(±0.001)  j5 0.117  j6 0.131  N·m
#   与独立的静摩擦测量（4340P 0.62 / 4310 0.145）吻合 ⇒ 数据可信。
#   ⚠️ **初值取测量值的 0.7 倍**：欠补偿只留残差；**过补偿**会让误差反号、甚至变成"负摩擦"
#     把关节推着走。分级往上加，别一步到位。（近端 ±0.15 不可重复 ⇒ 别调到 0.7 以上太多）
#
# ── ki_hold：宿主侧积分增益（2026-10-05 加）──
# **MIT 模式下固件没有积分**（τ = kp·Δp + kd·Δv + t_ff），所以 MIT 的稳态误差被
#   不可重复扰动/kp 卡住：真机实测 j3 在 kp=7 下差 0.134 rad，而 POS_VEL（固件积分）是 0.0016 rad。
#   把这 0.8 N·m 的扰动**积掉**，MIT 才能追平 POS_VEL 的静态精度。
# 做法：τ_i += ki_hold · (q_des − q) · dt，加进 MIT 帧的 t_ff（即宿主侧 PI + 重力前馈）。
# ⚠️ **默认 0.0 = 完全不生效**（一个字节都不变），要分级打开：
#   先保持模式小步试（如 0.3），确认静差收敛且**不振荡**，再往上加。
# ⚠️ 积分 + 100 Hz + 干摩擦（j3 有 ~0.8 N·m 不可重复扰动）是**极限环的经典配方**
#   ⇒ 插件里配了抗饱和（钳 ±0.3·torque_max 且饱和时停积）、误差门控（>0.15 rad 不积）、
#     以及四个复位条件（激活 / 命令跳变 / 残差守卫触发 / 失能）。
joints:
  joint1: {kp_hold: 25.0, kd_hold: 0.8, ki_hold: 0.3, friction_c: 0.378, friction_v_eps: 0.02}   # 4340P，待标定
  joint2: {kp_hold: 25.0, kd_hold: 0.8, ki_hold: 0.3, friction_c: 0.406, friction_v_eps: 0.02}   # 4340P，待标定
  joint3: {kp_hold: 25.0, kd_hold: 0.8, ki_hold: 0.3, friction_c: 0.525, friction_v_eps: 0.02}   # 4340P，待标定
  joint4: {kp_hold: 15.0, kd_hold: 0.8, ki_hold: 0.3, friction_c: 0.112, friction_v_eps: 0.02}   # 4310，与 DESIGN 参考值一致
  joint5: {kp_hold: 15.0, kd_hold: 0.8, ki_hold: 0.3, friction_c: 0.082, friction_v_eps: 0.02}   # 4310
  joint6: {kp_hold: 15.0, kd_hold: 0.8, ki_hold: 0.3, friction_c: 0.092, friction_v_eps: 0.02}   # 4310

# 重力模型辨识结果（2026-10-05）—— **这台机械臂自己的**质量与质心。
#
# 为什么需要它：`arm_description` 里那套惯量是**上游 reBotArm 的 CAD 数据**，与我们实际装出来的
# 机械臂不符。真机实测（张开位，POS_VEL 托住时读电机反馈的保持力矩）：
#     j2  模型 −0.23  vs  实测 −1.77   （差 7.8×）
#     j3  模型 −6.94  vs  实测 −5.27   （差 0.76×）
#     j4  模型 −1.99  vs  实测 −0.65   （差 0.32×）
# 符号全对，但**量级非均匀地错** ⇒ 直接拿它做前馈有害（j4 会多发 3 倍）。
#
# 怎么辨识的：POS_VEL（固件扛重力）自动走 40 个静止姿态，每个停稳后读 /joint_states 的
# position + effort（effort 是电机电流估计的保持力矩，**尺度已用已知 tau_ff 标定过，往返 ≈1:1**）。
# 重力项对每连杆的 (m, m·c) 是线性的 ⇒ 最小二乘。回归矩阵自己造（pinocchio 4 的
# computeStaticRegressor 给的形状不对，没用）。
#
# ⚠️ 秩亏缺（10/24）：参数不唯一。裸最小二乘会给出 m=0、质心 2.2 m 这类非物理解。
#    改用**向 URDF 名义值收缩的岭回归**（λ=0.01）—— 拟合精度**完全一样**，但参数回到物理区间。
#
# 精度（40 个姿态，留出 8 个）：
#     URDF 名义   整体 RMS = 1.323 N·m
#     辨识后      整体 RMS = 0.418 N·m（留出 0.411，无过拟合）
#     分关节(辨识后): j1 0.428  j2 0.434  j3 0.808  j4 0.070  j5 0.094  j6 0.094
#     ⚠️ j1 的 0.428 **全是**摩擦+走线扰动（j1 轴竖直、重力恒为 0），任何重力模型都消不掉。
#     ⚠️ j3 的 0.808 高于它的摩擦地板 0.36 ⇒ j3 上有非重力的、随构型变化的载荷。
#
# 辨识方法、数据集与拟合脚本在 log/real/（gitignored）：ident_collect.sh / ident_fit.py /
# ident_all2.csv / pi_ridge.npy。
#
# 注意：这里只辨识了**影响重力**的参数（质量 + 质心）。转动惯量对重力无贡献，脚本会保留
# URDF 里原来的 <inertia> 值 —— 所以这份模型**只适合做重力前馈**，别拿它做完整动力学。
meta:
  date: "2026-10-05"
  poses: 40
  ridge_lambda: 0.01
  rms_nominal: 1.323
  rms_identified: 0.418
  rms_holdout: 0.411


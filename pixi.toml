[workspace]
authors = ["Yln-shen <3432607998@qq.com>"]
channels = ["conda-forge", "robostack-jazzy"]
name = "DM_Armx"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
ros-jazzy-ros-core = ">=0.11.0,<0.12"
ros-jazzy-moveit-ros-planning = ">=2.12.4,<3"
colcon-common-extensions = ">=0.3.0,<0.4"
mujoco = ">=3.12.0,<4"
ros-jazzy-control-msgs = ">=5.9.0,<6"
pyserial = ">=3.5,<4"
pyyaml = ">=6,<7"
ros-jazzy-hardware-interface = ">=4.47.0,<5"
ros-jazzy-controller-manager = ">=4.47.0,<5"
ros-jazzy-joint-state-broadcaster = ">=4.42.1,<5"
ros-jazzy-joint-trajectory-controller = ">=4.42.1,<5"
ros-jazzy-ros2controlcli = ">=4.47.0,<5"
ros-jazzy-xacro = ">=2.1.1,<3"
ros-jazzy-robot-state-publisher = ">=3.3.4,<4"
ros-jazzy-joint-state-publisher = ">=2.4.3,<3"
ros-jazzy-joint-state-publisher-gui = ">=2.4.3,<3"
ros-jazzy-rviz2 = ">=14.1.23,<15"
ros-jazzy-tf2-ros = ">=0.36.22,<0.37"
ros-jazzy-moveit-ros-move-group = ">=2.12.4,<3"
ros-jazzy-moveit-kinematics = ">=2.12.4,<3"
ros-jazzy-moveit-planners-ompl = ">=2.12.4,<3"
ros-jazzy-moveit-simple-controller-manager = ">=2.12.4,<3"
ros-jazzy-moveit-configs-utils = ">=2.12.4,<3"
ros-jazzy-moveit-ros-visualization = ">=2.12.4,<3"

[activation.env]
# 让**链接器**找得到 $CONDA_PREFIX/lib：rclcpp 的传递依赖（-lcap / -llttng-ust）在那里，
# 而 pixi 默认不设 LIBRARY_PATH ⇒ 链可执行文件（gtest、ros2_control_node）会报「找不到 -lcap」。
# 共享库不受影响（允许未定义符号，运行时由 LD_LIBRARY_PATH 解析）。见 AGENTS 陷阱 #32。
LIBRARY_PATH = "$CONDA_PREFIX/lib"
